<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سالنامه</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="سالنامه">
<meta name="theme-color" content="#1d2563" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0e29" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&family=Manrope:wght@400;600;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{-webkit-text-size-adjust:100%;overscroll-behavior:none}
[hidden]{display:none!important}

/* Layout: top bar + year grid of 12 months; day drawer from the start edge; meeting note as full-screen sheet with type / pen modes */
:root{
  --paper:#f1f2f8; --card:#ffffff; --ink:#1b2147; --muted:#646b90; --line:#dde0ee;
  --accent:#2c3a94; --accent-soft:#e7e9f7; --saffron:#eea42f; --saffron-soft:#fdf0d6;
  --weekend:#c2453a; --red:#d32f2f; --ruled:#e6e8f3; --green:#2f8f50; --green-soft:#e1f2e6;
  --navy:#1d2563; --navy2:#34419e; --onnavy:#ffffff; --onamber:#1b2147; --grid:rgba(44,58,148,.045);
  --shadow:0 12px 40px rgba(29,37,99,.18);
  --fa:"Vazirmatn",Tahoma,"Geeza Pro",sans-serif;
  --en:"Manrope","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0c112c; --card:#161c44; --ink:#e6e8f7; --muted:#9ba1c6; --line:#262e62;
  --accent:#8b98f2; --accent-soft:#232b68; --saffron:#f2b443; --saffron-soft:#3a2e13;
  --weekend:#f08a7d; --red:#ff6f6f; --ruled:#1f2757; --green:#5ec27e; --green-soft:#16352a;
  --navy:#0a0e29; --navy2:#1e2770; --onnavy:#ffffff; --onamber:#1b2147; --grid:rgba(139,152,242,.05);
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0c112c; --card:#161c44; --ink:#e6e8f7; --muted:#9ba1c6; --line:#262e62;
  --accent:#8b98f2; --accent-soft:#232b68; --saffron:#f2b443; --saffron-soft:#3a2e13;
  --weekend:#f08a7d; --red:#ff6f6f; --ruled:#1f2757; --green:#5ec27e; --green-soft:#16352a;
  --navy:#0a0e29; --navy2:#1e2770; --onnavy:#ffffff; --onamber:#1b2147; --grid:rgba(139,152,242,.05);
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}
html,body{height:100%}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px;color:var(--ink);font-family:var(--fa);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-radius:0 0 22px 22px;box-shadow:var(--shadow)}
.navyband{background:linear-gradient(135deg,var(--navy),var(--navy2));color:var(--onnavy)}
.navyband .icon{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:var(--onnavy)}
.navyband .icon.primary{background:var(--saffron);border-color:var(--saffron);color:var(--onamber)}
.navyband .icon.danger{color:#ffb4a8}
.navyband .seg{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2)}
.navyband .seg button{color:rgba(255,255,255,.78)}
.navyband .seg button[aria-pressed="true"]{background:var(--saffron);color:var(--onamber)}
.navyband .search input{background:rgba(255,255,255,.96);color:#1b2147;border-color:transparent}
.navyband .search input::placeholder{color:#7a809f}
.navyband .brand small,.navyband .status,.navyband .saved{color:rgba(255,255,255,.72)}
.navyband .status .warn{color:#ffd28a}
.navyband .ttl{color:var(--onnavy)!important}
.navyband .ttl::placeholder{color:rgba(255,255,255,.55)!important}
.topin{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;margin-inline-end:auto}
.brand h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:13px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--card);font-weight:700}
.yearnav{display:flex;align-items:center;gap:4px}
.yearnav b{font-size:20px;min-width:118px;text-align:center;font-variant-numeric:tabular-nums}
.icon{border:1px solid var(--line);background:var(--card);border-radius:12px;min-width:40px;height:40px;display:inline-grid;place-items:center;padding:0 10px;font-size:15px}
.icon.primary{background:var(--accent);border-color:var(--accent);color:var(--card);font-weight:700}
.search{flex:1 1 260px;max-width:420px;position:relative}
.search input{width:100%;box-sizing:border-box;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font:inherit}

.status{font-size:12px;color:var(--muted);padding-block:6px 0}
.status .warn{color:var(--weekend)}

/* today strip */
.today{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;padding-block:18px 6px}
.today .fa-d{font-size:26px;font-weight:800}
.today .en-d{font-size:16px;color:var(--muted);font-weight:600}
.today .chip{margin-inline-start:auto}

/* year grid */
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;padding-block:14px 40px}
.month{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 12px 10px;min-width:0}
.month.cur{border-color:var(--saffron);box-shadow:0 0 0 1px var(--saffron)}
.mh{border:0;background:none;width:100%;padding:0;text-align:start;color:inherit;cursor:pointer}
.mh:hover b{color:var(--accent)}
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.mh b{font-size:17px}
.mh span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.wd{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.wd.we{color:var(--weekend)}
.day{position:relative;border:0;background:none;border-radius:9px;aspect-ratio:1/1.05;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;padding:0}
.day:hover{background:var(--accent-soft)}
.day .p{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.day .s{font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums}
.day.we .p{color:var(--weekend)}
.day.today{background:var(--saffron);}
.day.today .p,.day.today .s{color:var(--onamber)}
.day.sel{outline:2px solid var(--accent);outline-offset:-2px}
.day .marks{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.day .marks i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.day .marks i.m{background:var(--saffron);width:9px;border-radius:3px}
.day .marks i.f{background:var(--green)}
.day.today .marks i{background:var(--onamber)}
.legend{display:flex;gap:18px;font-size:12px;color:var(--muted);padding-block:0 4px;flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-inline-end:6px}
.legend i.m{background:var(--saffron);width:12px;border-radius:3px}
.legend i.f{background:var(--green)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,20,25,.35);z-index:40}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(580px,100%);background:var(--card);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dh{display:flex;align-items:flex-start;gap:10px;padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.dh .t{flex:1;min-width:0}
.dh .t b{display:block;font-size:22px;font-weight:800;text-wrap:balance}
.dh .t span{color:var(--muted);font-weight:600;font-size:14px}
.dbody{overflow:auto;padding:14px 18px 30px;display:flex;flex-direction:column;gap:22px;flex:1}
.sec h3{margin:0 0 8px;font-size:13px;letter-spacing:.04em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:0 12px;font:inherit}
ul.tasks{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
ul.tasks li{padding:10px 2px;border-bottom:1px dashed var(--line)}
.trow{display:flex;align-items:flex-start;gap:10px}
.tnum{flex:none;min-width:22px;height:26px;display:grid;place-items:center;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.trow input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:2px 0 0}
.tbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.ttext{font-weight:500}
ul.tasks li.done .ttext{text-decoration:line-through;color:var(--muted)}
.tres{color:var(--red);font-weight:600;font-size:14px}
.tres::before{content:"نتیجه: ";font-weight:800}
.tmeta{display:flex;flex-wrap:wrap;gap:4px 10px}
.tlink{border:0;background:none;padding:0;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.tlink.fu{color:var(--accent)}
.tacts{display:flex;align-items:center;gap:2px;flex:none}
.ta{border:1px solid var(--line);background:var(--card);border-radius:9px;font-size:12px;padding:3px 8px;color:var(--muted)}
.ta.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.x.arm{color:var(--card);background:var(--weekend);font-size:12px;width:auto;padding:0 8px}
.tpanel{margin:10px 0 2px;padding:10px;border-radius:12px;background:var(--paper);display:flex;flex-direction:column;gap:8px}
.tbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tbtns input[type=date]{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 10px;font:inherit}
.tbtns .both{font-size:13px;font-weight:600}
.resin{width:100%;box-sizing:border-box;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--red);font:inherit;font-weight:600;padding:8px 10px;resize:vertical}
.x{border:0;background:none;color:var(--muted);font-size:18px;width:34px;height:34px;border-radius:10px}
.x:hover{background:var(--paper);color:var(--weekend)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.mcard{display:block;width:100%;text-align:start;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;margin-top:8px;border-inline-start:4px solid var(--saffron)}
.mcard b{display:block;font-size:16px;overflow-wrap:anywhere}
.mcard .meta{font-size:12px;color:var(--muted);display:flex;gap:6px 12px;flex-wrap:wrap;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);border:0}
.chip.s{background:var(--saffron-soft);color:var(--ink)}
.chip button{border:0;background:none;padding:0 0 0 2px;font-size:14px;line-height:1;color:inherit}

/* meeting sheet */
.sheet{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sh{display:flex;align-items:center;gap:10px;padding-block:10px}
.sh .ttl{flex:1;min-width:0;font-size:20px;font-weight:800;border:0;background:none;color:var(--ink);font-family:var(--fa);padding:6px 4px}
.sh .ttl::placeholder{color:var(--muted);font-weight:500}
.saved{font-size:12px;color:var(--muted);white-space:nowrap}
.meta2{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-block:10px;background:var(--card);border-bottom:1px solid var(--line)}
.field{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.field input{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:0 10px;font:inherit}
.field .both{font-size:12px;color:var(--ink);font-weight:600}
.people{flex:1 1 320px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.people input{flex:1;min-width:140px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:0 10px;font:inherit}
.modebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:8px}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tools .sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}
.tools .sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--card) inset}
.tools .wbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.tools .wbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.tools .wbtn i{display:block;border-radius:9px;background:var(--ink)}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.notearea{flex:1;overflow:auto;min-height:0}
.typed{display:block;box-sizing:border-box;width:100%;max-width:900px;margin:14px auto 40px;min-height:70vh;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-size:17px;line-height:32px;padding:16px 22px;resize:none;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--ruled) 31px 32px);background-position:0 16px;background-attachment:local}
.inkwrap{max-width:900px;margin:14px auto 20px;position:relative;display:flex;flex-direction:column;gap:14px}
canvas.ink{display:block;width:100%;border:1px solid var(--line);border-radius:14px;background:var(--card);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.addpage{display:block;margin:0 auto 40px}
.danger{color:var(--weekend)}
.tabs{flex-wrap:wrap;border-radius:14px}
.tabs button{border-radius:11px}
.pane{max-width:900px;margin:14px auto 40px;display:flex;flex-direction:column;gap:12px}
.pane h4{margin:10px 0 0;font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.typed.small{min-height:28vh;margin:0}
.pane .typed{margin:0}
.recrow{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.recbtn{border:0;background:var(--red);color:#fff;font-weight:800;font-size:17px;padding:12px 22px;border-radius:999px}
.recbtn.on{background:var(--ink);color:var(--paper)}
.rectime{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;min-width:80px}
.recrow.live .rectime{color:var(--red)}
#lvl{width:160px;height:32px;max-width:100%}
.hint{margin:0;font-size:13px;color:var(--muted)}
.stat{font-size:13px;color:var(--muted)}
.stat.err{color:var(--red)}
.seg-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:6px}
.seg-row audio{height:34px;max-width:100%;flex:1 1 220px}
.seg-row .badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--saffron-soft)}
.seg-row .badge.ok{background:var(--accent-soft);color:var(--accent)}
.act{display:grid;grid-template-columns:28px minmax(0,1fr) 140px 150px auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.act input{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 10px;font:inherit;min-width:0;width:100%;box-sizing:border-box}
.act .jl{grid-column:3 / 5;font-size:11px;color:var(--muted);margin-top:-6px}
@media (max-width:700px){.act{grid-template-columns:28px minmax(0,1fr) auto}.act .ow,.act .du{grid-column:2 / 4}.act .jl{grid-column:2 / 4}}
.modal{position:fixed;inset:0;z-index:70;background:rgba(5,20,25,.45);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--card);border-radius:18px;box-shadow:var(--shadow);width:min(560px,100%);max-height:90vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.modal h3{margin:0;font-size:19px}
.modal label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.modal input{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:0 10px;font:inherit;direction:ltr;text-align:left}
.modal .note{font-size:12px;color:var(--muted);margin:0}


/* search */
.sres{padding-block:14px 40px;max-width:980px}
.sres .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.sres .people-index{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 16px}
.sres .chip.on{background:var(--accent);color:var(--card)}
.hl{background:var(--saffron-soft);border-radius:3px}
.mview{padding-block:16px 40px}
.mhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:6px 16px;margin-bottom:12px}
.mhead .mname{font-size:30px;font-weight:800;line-height:1.2;display:block}
.mhead .msub{color:var(--muted);font-weight:600;font-size:15px}
.mhead .mtd{font-size:14px;color:var(--muted);text-align:end}
.mhead .mtd b{color:var(--ink)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mwd{text-align:center;font-size:13px;color:var(--muted);font-weight:700;padding:2px 0}
.mwd.we{color:var(--weekend)}
.mwd .sm{display:none}
.mcell{min-height:122px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:6px 7px 7px;display:flex;flex-direction:column;gap:3px;text-align:start;min-width:0;overflow:hidden;color:var(--ink)}
.mcell:hover{border-color:var(--accent)}
.mcell .top{display:flex;justify-content:space-between;align-items:center;gap:4px}
.mcell .p{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.3}
.mcell .s{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.mcell.out{opacity:.38}
.mcell.we .p{color:var(--weekend)}
.mcell.today{border:2px solid var(--saffron)}
.mcell.today .p{background:var(--saffron);color:var(--onamber);border-radius:10px;padding:0 8px}
.mcell.sel{box-shadow:0 0 0 2px var(--accent)}
.ev{display:block;max-width:100%;box-sizing:border-box;flex:none;font-size:11.5px;line-height:1.5;padding:1px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ev.t{background:var(--accent-soft);color:var(--accent)}
.ev.t.done{text-decoration:line-through;opacity:.55}
.ev.m{background:var(--saffron-soft);color:var(--ink)}
.ev.f{background:var(--green-soft);color:var(--green)}
.ev.more{color:var(--muted);padding:0 4px}
@media (max-width:700px){.mwd .lg{display:none}.mwd .sm{display:inline}.mcell{min-height:66px;padding:4px;border-radius:10px;gap:2px}.mcell .p{font-size:15px}.mcell.today .p{padding:0 4px}.mcell .s{font-size:9px}.ev{font-size:0;height:5px;padding:0;border-radius:3px}.ev.more{display:none}.mhead .mname{font-size:24px}}
.tblwrap{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:12px}
table.fx{border-collapse:collapse;width:100%;min-width:640px;font-size:13px;font-variant-numeric:tabular-nums}
table.fx th{background:var(--accent-soft);color:var(--accent);font-weight:700;text-align:start;padding:8px;white-space:nowrap}
table.fx td{padding:8px;border-top:1px solid var(--line);white-space:nowrap}
table.fx tbody tr{cursor:pointer}
table.fx tbody tr:hover td{background:var(--paper)}
table.fx tfoot td{font-weight:800;background:var(--paper)}
table.fx .num{text-align:end}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;margin-inline-start:4px}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.wait{background:var(--saffron-soft);color:var(--ink)}
.fxform{margin-top:10px;padding:12px;border-radius:14px;background:var(--paper);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fxform label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.fxform input{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 10px;font:inherit;min-width:0;width:100%;box-sizing:border-box}
.fxform .fxtot{grid-column:1 / -1;font-size:15px;padding:8px 10px;border-radius:10px;background:var(--green-soft);color:var(--green)}
.fxform .fxtot b{font-size:18px}
.fxform .tbtns{grid-column:1 / -1}
.fxform .jd{font-size:11px;color:var(--ink)}
.deps{margin-top:8px;font-size:13px;color:var(--green)}
@media (max-width:480px){.fxform{grid-template-columns:minmax(0,1fr)}}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 18px;border-radius:999px;font-size:14px;z-index:60}
.menu{position:absolute;top:48px;inset-inline-end:0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;z-index:25;min-width:220px;display:flex;flex-direction:column}
.menu button,.menu label{border:0;background:none;text-align:start;padding:10px 12px;border-radius:10px;font-size:14px;cursor:pointer}
.menu button:hover,.menu label:hover{background:var(--paper)}
.rel{position:relative}
@media (max-width:560px){.brand small{display:none}.today .fa-d{font-size:21px}}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .22s ease-out}@keyframes slide{from{transform:translateX(30px);opacity:.4}}}
</style>
</head>
<body>
<div id="app" dir="rtl">
  <header class="top navyband"><div class="wrap topin">
    <div class="brand"><h1>سالنامه</h1><small id="brandSub">تقویم، کارها و یادداشت جلسات</small></div>
    <div class="seg" role="group" aria-label="نوع تقویم">
      <button id="mJ" aria-pressed="true">شمسی</button>
      <button id="mG" aria-pressed="false" class="en">Gregorian</button>
    </div>
    <div class="seg" role="group" aria-label="نمایش"><button id="vM" aria-pressed="true">ماه</button><button id="vY" aria-pressed="false">کل سال</button></div>
    <div class="yearnav">
      <button class="icon" id="yPrev" aria-label="سال قبل">›</button>
      <b id="yLbl"></b>
      <button class="icon" id="yNext" aria-label="سال بعد">‹</button>
    </div>
    <button class="icon" id="goToday">امروز</button>
    <div class="search"><input id="q" type="search" placeholder="جستجوی جلسه: موضوع یا شرکت‌کننده" autocomplete="off"></div>
    <button class="icon primary" id="newMeet">+ جلسه</button>
    <div class="rel"><button class="icon" id="menuBtn" aria-label="بیشتر">⋯</button>
      <div class="menu" id="menu" hidden>
        <button id="aiSetM">تنظیمات هوش مصنوعی (ضبط و صورت جلسه)</button>
        <button id="exp">گرفتن نسخه پشتیبان (JSON)</button>
        <label for="impFile">بازگردانی از فایل پشتیبان</label>
        <input id="impFile" type="file" accept="application/json,.json" hidden>
      </div>
    </div>
  </div>
  <div class="wrap status" id="status"></div>
  </header>
  <main id="main"></main>
</div>

<script>
/* ---------- Jalali <-> Gregorian (jalaali algorithm) ---------- */
const div=(a,b)=>~~(a/b), mod=(a,b)=>a-~~(a/b)*b;
const BR=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function jalCal(jy){let gy=jy+621,leapJ=-14,jp=BR[0],jm,jump=0,n,i;
  for(i=1;i<BR.length;i++){jm=BR[i];jump=jm-jp;if(jy<jm)break;leapJ+=div(jump,33)*8+div(mod(jump,33),4);jp=jm}
  n=jy-jp;leapJ+=div(n,33)*8+div(mod(n,33)+3,4);if(mod(jump,33)===4&&jump-n===4)leapJ++;
  const leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150,march=20+leapJ-leapG;
  if(jump-n<6)n=n-jump+div(jump+4,33)*33;let leap=mod(mod(n+1,33)-1,4);if(leap===-1)leap=4;return{leap,gy,march}}
function g2d(gy,gm,gd){let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;return d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752}
function d2g(j){let x=4*j+139361631;x=x+div(div(4*j+183187720,146097)*3,4)*4-3908;const i=div(mod(x,1461),4)*5+308;const gd=div(mod(i,153),5)+1,gm=mod(div(i,153),12)+1;return{gy:div(x,1461)-100100+div(8-gm,6),gm,gd}}
function j2d(jy,jm,jd){const r=jalCal(jy);return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1}
function d2j(j){let gy=d2g(j).gy,jy=gy-621;const r=jalCal(jy);let k=j-g2d(gy,3,r.march),jm,jd;
  if(k>=0){if(k<=185){return{jy,jm:1+div(k,31),jd:mod(k,31)+1}}k-=186}else{jy--;k+=179;if(r.leap===1)k++}
  return{jy,jm:7+div(k,30),jd:mod(k,30)+1}}
const jLen=(jy,jm)=>jm<=6?31:jm<=11?30:(jalCal(jy).leap===0?30:29);
const gLen=(gy,gm)=>new Date(gy,gm,0).getDate();
const iso=(j)=>{const g=d2g(j);return g.gy+'-'+String(g.gm).padStart(2,'0')+'-'+String(g.gd).padStart(2,'0')};
const fromIso=(s)=>{const [y,m,d]=s.split('-').map(Number);return g2d(y,m,d)};
const dow=(j)=>mod(j+1,7); // 0=Sun..6=Sat

const JM=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const GM=['January','February','March','April','May','June','July','August','September','October','November','December'];
const FAWD=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
const ENWD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const fa=(n)=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function faDate(j){const x=d2j(j);return FAWD[dow(j)]+' '+fa(x.jd)+' '+JM[x.jm-1]+' '+fa(x.jy)}
function enDate(j){const g=d2g(j);return ENWD[dow(j)]+', '+GM[g.gm-1]+' '+g.gd+', '+g.gy}
function faShort(j){const x=d2j(j);return fa(x.jd)+' '+JM[x.jm-1]+' '+fa(x.jy)}
function enShort(j){const g=d2g(j);return GM[g.gm-1].slice(0,3)+' '+g.gd+', '+g.gy}
function todayJ(){const d=new Date();return g2d(d.getFullYear(),d.getMonth()+1,d.getDate())}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const norm=(s)=>String(s||'').toLowerCase().replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[‌‏ً-ْ]/g,'').replace(/\s+/g,' ').trim();

/* ---------- storage: IndexedDB on this device ---------- */
const LS_UI='salnameh.ui.v1';
const lsGet=(k)=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
const S={items:new Map(),ink:{},mode:'idb',ready:false};
let IDB=null;
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('salnameh',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('items'))d.createObjectStore('items',{keyPath:'id'});if(!d.objectStoreNames.contains('audio')){const a=d.createObjectStore('audio',{keyPath:'id'});a.createIndex('mid','mid')}};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function tx(mode,fn){return new Promise((res,rej)=>{const t=IDB.transaction('items',mode);const st=t.objectStore('items');const out=fn(st);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
async function put(o){
  if(o.kind==='ink'){(S.ink[o.mid]=(S.ink[o.mid]||[]).filter(x=>x.id!==o.id)).push(o)}else S.items.set(o.id,o);
  try{await tx('readwrite',st=>st.put(o))}catch(e){toast('ذخیره نشد — فضای دستگاه را بررسی کنید')}
}
async function del(id,mid){
  if(mid&&S.ink[mid])S.ink[mid]=S.ink[mid].filter(x=>x.id!==id);else S.items.delete(id);
  try{await tx('readwrite',st=>st.delete(id))}catch(e){}
}
async function loadInk(mid){
  const parts=(S.ink[mid]||[]).slice().sort((a,b)=>a.k-b.k);
  if(!parts.length)return [];
  try{return JSON.parse(parts.map(p=>p.s).join(''))}catch(e){return []}
}
async function saveInk(m,strokes){
  const str=JSON.stringify(strokes),CH=180000,n=Math.ceil(str.length/CH);
  const old=(S.ink[m.id]||[]).map(x=>x.id);
  const ids=[];for(let k=0;k<n;k++){const id='i_'+m.id+'_'+k;ids.push(id);await put({kind:'ink',id,mid:m.id,k,s:str.slice(k*CH,(k+1)*CH)})}
  for(const id of old)if(!ids.includes(id))await del(id,m.id);
}
async function initStore(){
  render();
  try{
    IDB=await idbOpen();
    const all=await new Promise((res,rej)=>{const r=IDB.transaction('items').objectStore('items').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
    S.items=new Map();S.ink={};
    all.forEach(o=>{if(o.kind==='ink')(S.ink[o.mid]=S.ink[o.mid]||[]).push(o);else S.items.set(o.id,o)});
    S.ready=true;render();setStatus('');
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
    const last=lsGet('salnameh.lastBackup');
    if(S.items.size>5&&(!last||Date.now()-last>14*864e5))setStatus('<span class="warn">بیش از دو هفته از آخرین نسخه پشتیبان گذشته — از منوی ⋯ پشتیبان بگیرید.</span>');
  }catch(e){setStatus('<span class="warn">حافظه دستگاه در دسترس نیست. اگر در حالت Private هستید، آن را خاموش کنید.</span>')}
}
function setStatus(h){const el=document.getElementById('status');el.innerHTML=h;el.hidden=!h}

/* ---------- UI state ---------- */
const ui=Object.assign({cal:'J',layout:'month',view:'year',sel:null,q:'',filter:'all',person:null},lsGet(LS_UI)||{});
ui.view='year';ui.sel=null;ui.q='';ui.person=null;
const TJ=todayJ();
function toToday(){if(ui.cal==='J'){const x=d2j(TJ);ui.year=x.jy;ui.month=x.jm}else{const x=d2g(TJ);ui.year=x.gy;ui.month=x.gm}}
toToday();
const saveUI=()=>lsSet(LS_UI,{cal:ui.cal,filter:ui.filter,layout:ui.layout});
const $=(s)=>document.querySelector(s);
let toastT;function toast(t){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el)}el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2400)}

function byDate(){const map={};for(const o of S.items.values()){if(!o.date)continue;(map[o.date]=map[o.date]||{t:0,m:0});if(o.kind==='task'&&!o.done)map[o.date].t++;if(o.kind==='meeting')map[o.date].m++;if(o.kind==='fx')map[o.date].f=(map[o.date].f||0)+1}return map}
const meetings=()=>[...S.items.values()].filter(o=>o.kind==='meeting');

/* ---------- render: year ---------- */
function render(){
  $('#mJ').setAttribute('aria-pressed',ui.cal==='J');$('#mG').setAttribute('aria-pressed',ui.cal==='G');
  const J0=ui.cal==='J',MO=ui.layout==='month';
  $('#vM').setAttribute('aria-pressed',MO);$('#vY').setAttribute('aria-pressed',!MO);
  $('#yLbl').textContent=MO?(J0?JM[ui.month-1]+' '+fa(ui.year):GM[ui.month-1]+' '+ui.year):(J0?fa(ui.year):ui.year);
  $('#yLbl').className=J0?'':'en';
  $('#yPrev').setAttribute('aria-label',MO?'ماه قبل':'سال قبل');$('#yNext').setAttribute('aria-label',MO?'ماه بعد':'سال بعد');
  if(ui.view==='search')return renderSearch();
  if(MO){renderMonth();if(ui.sel!=null)renderDrawer();return}
  const marks=byDate();
  const J=ui.cal==='J';
  const wdHead=J?['ش','ی','د','س','چ','پ','ج']:['S','M','T','W','T','F','S'];
  const weIdx=J?[6]:[0,6];
  let h=`<div class="wrap"><div class="today"><span class="fa-d">${faDate(TJ)}</span><span class="en-d en">${enDate(TJ)}</span></div>
  <div class="legend"><span><i></i>کار انجام‌نشده</span><span><i class="m"></i>جلسه</span><span><i class="f"></i>خرید ارز</span><span>روی نام هر ماه بزنید تا برگ همان ماه باز شود</span></div>
  <div class="year" dir="${J?'rtl':'ltr'}">`;
  const curJ=d2j(TJ),curG=d2g(TJ);
  for(let m=1;m<=12;m++){
    const start=J?j2d(ui.year,m,1):g2d(ui.year,m,1);
    const len=J?jLen(ui.year,m):gLen(ui.year,m);
    const end=start+len-1;
    const lead=J?mod(dow(start)+1,7):dow(start);
    let sub;
    if(J){const a=d2g(start),b=d2g(end);sub=GM[a.gm-1].slice(0,3)+(a.gm!==b.gm?' – '+GM[b.gm-1].slice(0,3):'')+' '+b.gy}
    else{const a=d2j(start),b=d2j(end);sub=JM[a.jm-1]+(a.jm!==b.jm?' – '+JM[b.jm-1]:'')+' '+fa(b.jy)}
    const isCur=J?(curJ.jy===ui.year&&curJ.jm===m):(curG.gy===ui.year&&curG.gm===m);
    h+=`<section class="month${isCur?' cur':''}" aria-label="${J?JM[m-1]:GM[m-1]}"><button class="mh" data-gom="${m}"><b class="${J?'':'en'}">${J?JM[m-1]:GM[m-1]}</b><span class="${J?'en':''}">${esc(sub)}</span></button><div class="grid7">`;
    wdHead.forEach((w,i)=>h+=`<div class="wd${weIdx.includes(i)?' we':''} ${J?'':'en'}">${w}</div>`);
    for(let i=0;i<lead;i++)h+='<div></div>';
    for(let j=start;j<=end;j++){
      const col=J?mod(dow(j)+1,7):dow(j), key=iso(j), mk=marks[key];
      const x=J?d2j(j).jd:d2g(j).gd, y=J?d2g(j).gd:d2j(j).jd;
      const cls=['day'];if(weIdx.includes(col))cls.push('we');if(j===TJ)cls.push('today');if(ui.sel===j)cls.push('sel');
      let mm='';if(mk&&(mk.t||mk.m||mk.f)){mm='<span class="marks">'+(mk.t?'<i></i>':'')+(mk.m?'<i class="m"></i>':'')+(mk.f?'<i class="f"></i>':'')+'</span>'}
      h+=`<button class="${cls.join(' ')}" data-j="${j}" aria-label="${esc(faDate(j))} — ${esc(enDate(j))}"><span class="p ${J?'':'en'}">${J?fa(x):x}</span><span class="s ${J?'en':''}">${J?y:fa(y)}</span>${mm}</button>`;
    }
    h+='</div></section>';
  }
  h+='</div></div>';
  $('#main').innerHTML=h;
  if(ui.sel!=null)renderDrawer();
}

/* ---------- numbers ---------- */
const toEn=(v)=>String(v??'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.').replace(/[,٬،\s]/g,'');
const num=(v)=>{const x=parseFloat(toEn(v));return isFinite(x)?x:0};
const fmtN=(v,dec=0)=>fa((+v||0).toLocaleString('en-US',{maximumFractionDigits:dec})).replace(/,/g,'٬');

/* ---------- render: month sheet ---------- */
function renderMonth(){
  const J=ui.cal==='J',y=ui.year,m=ui.month;
  const start=J?j2d(y,m,1):g2d(y,m,1),len=J?jLen(y,m):gLen(y,m),end=start+len-1;
  const colOf=(j)=>J?mod(dow(j)+1,7):dow(j);
  const g0=start-colOf(start),g1=end+(6-colOf(end));
  const idx={};const add=(k,o)=>{(idx[k]=idx[k]||[]).push(o)};
  for(const o of S.items.values()){if(!o.date)continue;
    if(o.kind==='meeting')add(o.date,{o:0,t:o.time||'',h:`<span class="ev m">${o.time?fa(o.time)+' ':''}${esc(o.title||'جلسه')}</span>`});
    else if(o.kind==='fx'){add(o.date,{o:1,h:`<span class="ev f">${fmtN(o.amt,2)} CAD · ${esc(o.name||'')}</span>`});if(o.dep&&o.dep!==o.date)add(o.dep,{o:1,h:`<span class="ev f">واریز ${fmtN(o.amt,2)} CAD · ${esc(o.name||'')}</span>`})}
    else if(o.kind==='task')add(o.date,{o:2,a:o.at||0,h:`<span class="ev t${o.done?' done':''}">${esc(o.text)}</span>`})}
  let sub;if(J){const a=d2g(start),b=d2g(end);sub=GM[a.gm-1]+' '+a.gd+' – '+GM[b.gm-1]+' '+b.gd+', '+b.gy}
  else{const a=d2j(start),b=d2j(end);sub=fa(a.jd)+' '+JM[a.jm-1]+' – '+fa(b.jd)+' '+JM[b.jm-1]+' '+fa(b.jy)}
  const WD=J?[['شنبه','ش'],['یکشنبه','ی'],['دوشنبه','د'],['سه‌شنبه','س'],['چهارشنبه','چ'],['پنجشنبه','پ'],['جمعه','ج']]:[['Sunday','S'],['Monday','M'],['Tuesday','T'],['Wednesday','W'],['Thursday','T'],['Friday','F'],['Saturday','S']];
  const weIdx=J?[6]:[0,6];
  let h=`<div class="wrap mview"><div class="mhead"><div><span class="mname ${J?'':'en'}">${J?JM[m-1]+' '+fa(y):GM[m-1]+' '+y}</span><span class="msub ${J?'en':''}">${esc(sub)}</span></div>
    <div class="mtd">امروز: <b>${faDate(TJ)}</b><br><span class="en">${enDate(TJ)}</span></div></div>
    <div class="mgrid" dir="${J?'rtl':'ltr'}">`;
  WD.forEach((w,i)=>h+=`<div class="mwd${weIdx.includes(i)?' we':''} ${J?'':'en'}"><span class="lg">${w[0]}</span><span class="sm">${w[1]}</span></div>`);
  for(let j=g0;j<=g1;j++){
    const key=iso(j),col=colOf(j),out=j<start||j>end;
    const x=J?d2j(j).jd:d2g(j).gd,yy=J?d2g(j).gd:d2j(j).jd;
    const evs=(idx[key]||[]).sort((a,b)=>a.o-b.o||(a.t||'').localeCompare(b.t||'')||(a.a||0)-(b.a||0));
    const cls=['mcell'];if(out)cls.push('out');if(weIdx.includes(col))cls.push('we');if(j===TJ)cls.push('today');if(ui.sel===j)cls.push('sel');
    const MAX=4;const shown=evs.slice(0,MAX).map(e=>e.h).join('')+(evs.length>MAX?`<span class="ev more">+${fa(evs.length-MAX)} مورد دیگر</span>`:'');
    h+=`<button class="${cls.join(' ')}" data-j="${j}" aria-label="${esc(faDate(j))} — ${esc(enDate(j))}${evs.length?' — '+fa(evs.length)+' مورد':''}"><span class="top"><span class="p ${J?'':'en'}">${J?fa(x):x}</span><span class="s ${J?'en':''}">${J?yy:fa(yy)}</span></span>${shown}</button>`;
  }

function fxSection(key){

function hiTxt(s,q){s=String(s||'');const n=norm(s),i=n.indexOf(q);if(!q||i<0)return esc(s);

  if(n.length===s.length)return esc(s.slice(0,i))+'<mark class="hl">'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length));return esc(s)}

/* ---------- audio store ---------- */
function audioPut(o){return tx2('readwrite',st=>st.put(o))}
function audioDel(id){return tx2('readwrite',st=>st.delete(id)).catch(()=>{})}
function audioList(mid){return new Promise((res)=>{try{const r=IDB.transaction('audio').objectStore('audio').index('mid').getAll(mid);r.onsuccess=()=>res((r.result||[]).sort((a,b)=>a.at-b.at));r.onerror=()=>res([])}catch(e){res([])}})}
function tx2(mode,fn){return new Promise((res,rej)=>{const t=IDB.transaction('audio',mode);fn(t.objectStore('audio'));t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}

async function transcribeBlob(blob,hint){
  const c=aiCfg();if(!c.oa)throw new Error('ابتدا کلید OpenAI را در تنظیمات وارد کنید');
  const ty=blob.type||'';const ext=ty.includes('webm')?'webm':ty.includes('ogg')||ty.includes('opus')?'ogg':ty.includes('mpeg')?'mp3':ty.includes('wav')?'wav':ty.includes('m4a')?'m4a':'mp4';
  const fname=(blob.name||('meeting.'+ext)).replace(/\.opus$/i,'.ogg');
  const go=async(model)=>{const fd=new FormData();fd.append('file',blob,fname);fd.append('model',model);fd.append('language','fa');if(hint)fd.append('prompt',hint);fd.append('response_format','json');
    return fetch('https://api.openai.com/v1/audio/transcriptions',{method:'POST',headers:{Authorization:'Bearer '+c.oa},body:fd})};
  let r;try{r=await go(c.stt)}catch(e){throw new Error('اتصال اینترنت برقرار نیست')}
  if(!r.ok&&(r.status===400||r.status===404)&&c.stt!=='whisper-1'){r=await go('whisper-1')}
  if(!r.ok)throw new Error(await apiErr(r,'OpenAI'));
  const j=await r.json();return (j.text||'').trim();
}

}
function minutesPrompt(m,withImgs){
  const j=fromIso(m.date);
  return `صورت جلسه این جلسه را به فارسی رسمی و روان بنویس.
اطلاعات جلسه:
- موضوع: ${m.title||'(بدون عنوان)'}
- تاریخ: ${faDate(j)} برابر با ${enDate(j)} (تاریخ میلادی ISO: ${m.date})
- ساعت: ${m.time||'-'}
- حاضرین: ${(m.people||[]).join('، ')||'-'}

دستور جلسه (از طرف کاربر):
${m.agenda||'(وارد نشده — از محتوای جلسه استخراج کن)'}

یادداشت‌های تایپی:
${m.text||'-'}

متن گفتگوی پیاده‌شده از صدا (ممکن است خطای تایپی داشته باشد):
${m.transcript||'-'}
${withImgs?'\nتصاویر پیوست، یادداشت‌های دست‌نویس همین جلسه هستند؛ محتوای آن‌ها را هم لحاظ کن.\n':''}
فقط و فقط یک شیء JSON معتبر برگردان، بدون هیچ متن دیگر و بدون \`\`\`، با این ساختار:
{"agenda":["مورد دستور جلسه"],"summary":"خلاصه کوتاه جلسه در ۲ تا ۴ جمله","items":[{"topic":"عنوان بند","discussion":["نکته مطرح‌شده"],"decisions":["مصوبه"]}],"actions":[{"task":"اقدامی که باید پیگیری شود","owner":"نام مسئول یا خالی","due":"YYYY-MM-DD میلادی یا خالی"}]}
قواعد: فقط چیزهایی را بنویس که در جلسه گفته یا نوشته شده؛ چیزی از خودت اضافه نکن. نام افراد را مطابق فهرست حاضرین بنویس. اگر مهلتی به تاریخ شمسی یا نسبی (مثل «هفته بعد») گفته شد، آن را نسبت به تاریخ جلسه به تاریخ میلادی ISO تبدیل کن. بندها را به ترتیب دستور جلسه مرتب کن.`;
}
function parseMinutes(txt){const a=txt.indexOf('{'),b=txt.lastIndexOf('}');if(a<0||b<a)throw new Error('پاسخ قالب درستی نداشت');return JSON.parse(txt.slice(a,b+1))}
function minutesText(m,ai){
  const j=fromIso(m.date),L=[];const n=(i)=>fa(i+1)+'. ';
  L.push('صورت جلسه: '+(m.title||''));L.push('تاریخ: '+faDate(j)+'  |  '+enDate(j)+(m.time?'  |  ساعت '+fa(m.time):''));
  if((m.people||[]).length)L.push('حاضرین: '+m.people.join('، '));L.push('');
  if(ai.agenda&&ai.agenda.length){L.push('دستور جلسه:');ai.agenda.forEach((x,i)=>L.push(n(i)+x));L.push('')}
  if(ai.summary){L.push('خلاصه:');L.push(ai.summary);L.push('')}
  (ai.items||[]).forEach((it,i)=>{L.push(n(i)+it.topic);(it.discussion||[]).forEach(x=>L.push('   • '+x));(it.decisions||[]).forEach(x=>L.push('   ✓ مصوبه: '+x));L.push('')});
  if((ai.actions||[]).length){L.push('موارد پیگیری:');ai.actions.forEach((a,i)=>L.push(n(i)+a.task+(a.owner?' — مسئول: '+a.owner:'')+(a.due&&/^\d{4}-\d\d-\d\d$/.test(a.due)?' — مهلت: '+faShort(fromIso(a.due)):'')))}
  return L.join('\n').trim();
}
async function callClaude(m,strokes){
  const c=aiCfg();if(!c.an)throw new Error('ابتدا کلید Anthropic را در تنظیمات وارد کنید — یا از «کپی برای Claude» استفاده کنید');
  const imgs=inkImages(strokes,m.pages||1);
  const content=imgs.map(d=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data:d}}));content.push({type:'text',text:minutesPrompt(m,imgs.length>0)});
  let r;try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':c.an,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:c.llm,max_tokens:8000,system:'تو منشی دقیق و حرفه‌ای جلسات کاری هستی و صورت جلسه را به فارسی می‌نویسی.',messages:[{role:'user',content}]})})}catch(e){throw new Error('اتصال اینترنت برقرار نیست')}
  if(!r.ok)throw new Error(await apiErr(r,'Anthropic'));
  const j=await r.json();return (j.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('');
}
const fmtDur=(ms)=>{const t=Math.floor(ms/1000);return fa(String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'))};

/* ---------- recording, transcript, minutes, follow-ups inside a meeting ---------- */
function meetingExtras(st,sh,commit,setTab,getStrokes){
  const q=(s)=>sh.querySelector(s);
  ['#aiSet1','#aiSet2'].forEach(x=>q(x).onclick=openAISettings);
  q('#mAgenda').oninput=()=>{st.m.agenda=q('#mAgenda').value;commit()};
  q('#mTr').oninput=()=>{st.m.transcript=q('#mTr').value;commit()};
  q('#mMin').oninput=()=>{st.m.minutes=q('#mMin').value;commit()};
  st.segs=[];const urls=[];
  async function renderSegs(){st.segs=await audioList(st.m.id);urls.forEach(u=>URL.revokeObjectURL(u));urls.length=0;
    const box=q('#segList');if(!box)return;
    box.innerHTML=st.segs.length?st.segs.map((a,i)=>{const u=URL.createObjectURL(a.blob);urls.push(u);
      return `<div class="seg-row"><b>${a.name?esc(a.name):'بخش '+fa(i+1)}</b><span class="stat">${fmtDur(a.dur||0)}</span><audio controls preload="none" src="${u}"></audio><span class="badge${a.tr!=null?' ok':''}">${a.tr!=null?'✓ به متن تبدیل شد':'در انتظار تبدیل'}</span><button class="x" data-adel="${a.id}" aria-label="حذف صدا">✕</button></div>`}).join(''):'<div class="hint">هنوز صدایی ضبط نشده.</div>';
    box.querySelectorAll('[data-adel]').forEach(b=>b.onclick=async()=>{if(b.dataset.arm){await audioDel(b.dataset.adel);renderSegs()}else{b.dataset.arm=1;b.textContent='حذف؟';b.classList.add('arm')}});
  }
  st.renderSegs=renderSegs;

  /* recorder */
  const R={active:false,paused:false,stream:null,r:null,doneMs:0,segAcc:0,runStart:0,lastSegMs:0,tick:null,wake:null,ac:null,an:null,raf:0,rotating:false,onDone:null};
  st.rec=R;
  const btn=q('#recBtn'),pz=q('#recPause'),tm=q('#recTime'),lvl=q('#lvl'),lc=lvl.getContext('2d');
  const mime=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
  const segMs=()=>R.segAcc+(R.paused?0:Date.now()-R.runStart);
  function startSeg(){const r=new MediaRecorder(R.stream,mime?{mimeType:mime}:undefined);const chunks=[];const t0=Date.now();
    r.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    r.onstop=async()=>{const blob=new Blob(chunks,{type:r.mimeType||mime||'audio/mp4'});
      if(blob.size>1000){try{await audioPut({id:'a_'+st.m.id+'_'+t0,mid:st.m.id,at:t0,dur:R.lastSegMs,blob,tr:null})}catch(e){toast('صدا ذخیره نشد — فضای iPad را بررسی کنید')}}
      if(R.active&&R.rotating){R.rotating=false;startSeg()}else if(!R.active&&R.onDone){const f=R.onDone;R.onDone=null;f()}
      st.renderSegs()};
    r.start(1000);R.r=r;R.segAcc=0;R.runStart=Date.now()}
  function drawLvl(){if(!R.an)return;const a=new Uint8Array(R.an.fftSize);R.an.getByteTimeDomainData(a);let m=0;for(const v of a)m=Math.max(m,Math.abs(v-128));
    const css=getComputedStyle(document.documentElement);lc.clearRect(0,0,160,32);lc.fillStyle=css.getPropertyValue('--line');lc.fillRect(0,13,160,6);lc.fillStyle=css.getPropertyValue('--red');lc.fillRect(0,13,R.paused?0:Math.min(160,m/128*160*1.8),6);R.raf=requestAnimationFrame(drawLvl)}
  async function start(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast('ضبط صدا در این دستگاه پشتیبانی نمی‌شود');return}
    try{R.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}catch(e){toast('اجازه میکروفون داده نشد — در Settings › Apps › Safari › Microphone بررسی کنید');return}
    R.active=true;R.paused=false;R.doneMs=0;startSeg();
    try{R.ac=new (window.AudioContext||window.webkitAudioContext)();const src=R.ac.createMediaStreamSource(R.stream);R.an=R.ac.createAnalyser();R.an.fftSize=512;src.connect(R.an);drawLvl()}catch(e){}
    try{R.wake=await navigator.wakeLock.request('screen')}catch(e){}
    R.tick=setInterval(()=>{tm.textContent=fmtDur(R.doneMs+segMs());
      if(!R.paused&&!R.rotating&&segMs()>10*60*1000){R.lastSegMs=segMs();R.doneMs+=R.lastSegMs;R.rotating=true;R.r.stop()}},500);
    btn.textContent='■ پایان ضبط';btn.classList.add('on');pz.hidden=false;q('.recrow').classList.add('live');
  }
  R.stop=()=>{if(!R.active)return;R.lastSegMs=segMs();R.active=false;clearInterval(R.tick);cancelAnimationFrame(R.raf);
    try{if(R.r.state!=='inactive')R.r.stop()}catch(e){}
    try{R.stream.getTracks().forEach(t=>t.stop())}catch(e){}try{R.ac&&R.ac.close()}catch(e){}R.an=null;try{R.wake&&R.wake.release()}catch(e){}
    R.paused=false;if(btn.isConnected){btn.textContent='● شروع ضبط';btn.classList.remove('on');pz.hidden=true;pz.textContent='❚❚ مکث';q('.recrow').classList.remove('live')}};
  btn.onclick=()=>{if(R.active){R.onDone=()=>{if(aiCfg().oa)doSTT()};R.stop()}else start()};
  pz.onclick=()=>{if(!R.active)return;
    if(!R.paused){try{R.r.pause()}catch(e){}R.segAcc+=Date.now()-R.runStart;R.paused=true;pz.textContent='▶ ادامه'}
    else{try{R.r.resume()}catch(e){}R.runStart=Date.now();R.paused=false;pz.textContent='❚❚ مکث'}};
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&R.active)toast('ضبط در پس‌زمینه ممکن است قطع شود')});

  /* transcription */
  let sttBusy=false;
  async function doSTT(){if(sttBusy)return;const stat=q('#sttStat');if(!stat)return;
    const todo=(await audioList(st.m.id)).filter(a=>a.tr==null);
    if(!todo.length){stat.textContent='همه بخش‌ها قبلاً به متن تبدیل شده‌اند';stat.className='stat';return}
    if(!aiCfg().oa){stat.textContent='برای تبدیل صدا به متن، کلید OpenAI را در تنظیمات وارد کنید';stat.className='stat err';return}
    sttBusy=true;const hint=[st.m.title,(st.m.people||[]).join('، ')].filter(Boolean).join(' — ');
    try{for(let i=0;i<todo.length;i++){stat.className='stat';stat.textContent='در حال تبدیل بخش '+fa(i+1)+' از '+fa(todo.length)+'…';
        const t=await transcribeBlob(todo[i].blob,hint);todo[i].tr=t;await audioPut(todo[i]);
        st.m.transcript=((st.m.transcript||'').trim()+'\n\n'+t).trim();const ta=q('#mTr');if(ta)ta.value=st.m.transcript;commit()}
      stat.textContent='✓ متن آماده شد — حالا می‌توانید در تب «صورت جلسه» آن را بسازید';}
    catch(e){stat.textContent=e.message;stat.className='stat err'}
    sttBusy=false;renderSegs()}
  q('#sttBtn').onclick=doSTT;
  q('#audIn').onchange=async()=>{const f=q('#audIn').files[0];q('#audIn').value='';if(!f)return;
    if(f.size>25*1024*1024){toast('فایل بزرگ‌تر از ۲۵ مگابایت است؛ آن را کوتاه‌تر کنید یا به چند بخش تقسیم کنید');return}
    const dur=await new Promise(res=>{const u=URL.createObjectURL(f),a=new Audio();a.preload='metadata';a.onloadedmetadata=()=>{res(isFinite(a.duration)?a.duration*1000:0);URL.revokeObjectURL(u)};a.onerror=()=>res(0);a.src=u;setTimeout(()=>res(0),4000)});
    try{await audioPut({id:'a_'+st.m.id+'_'+Date.now(),mid:st.m.id,at:Date.now(),dur,blob:f,name:f.name,tr:null})}catch(e){toast('فایل ذخیره نشد');return}
    st.renderSegs();toast('فایل صوتی اضافه شد');if(aiCfg().oa)doSTT()};

  /* minutes */
  const mstat=q('#minStat');
  const apply=(ai)=>{st.m.ai=ai;st.m.minutes=minutesText(st.m,ai);q('#mMin').value=st.m.minutes;
    const old=st.m.actions||[];st.m.actions=(ai.actions||[]).map(a=>({id:uid(),task:a.task||'',owner:a.owner||'',due:/^\d{4}-\d\d-\d\d$/.test(a.due||'')?a.due:''}));
    old.filter(a=>a.taskId).forEach(a=>st.m.actions.push(a)); // keep ones already sent to tasks
    if(!st.m.agenda&&ai.agenda&&ai.agenda.length){st.m.agenda=ai.agenda.join('\n');q('#mAgenda').value=st.m.agenda}
    commit();renderActs();mstat.className='stat';mstat.textContent='✓ صورت جلسه آماده شد — متن را بازبینی و موارد پیگیری را به کارها اضافه کنید'};
  q('#aiMin').onclick=async()=>{
    if(!st.m.transcript&&!st.m.text&&!st.m.agenda&&!getStrokes().length){mstat.className='stat err';mstat.textContent='هنوز محتوایی برای این جلسه نیست — ضبط کنید، یادداشت بنویسید یا دستور جلسه را وارد کنید';return}
    if(st.m.minutes&&!q('#aiMin').dataset.arm){q('#aiMin').dataset.arm=1;q('#aiMin').textContent='صورت جلسه فعلی جایگزین شود؟ دوباره بزنید';setTimeout(()=>{const b=q('#aiMin');if(b){delete b.dataset.arm;b.textContent='✦ تهیه صورت جلسه'}},4000);return}
    delete q('#aiMin').dataset.arm;q('#aiMin').textContent='✦ تهیه صورت جلسه';
    q('#aiMin').disabled=true;mstat.className='stat';mstat.textContent='Claude در حال نوشتن صورت جلسه است…';
    try{const t=await callClaude(st.m,getStrokes());apply(parseMinutes(t))}catch(e){mstat.className='stat err';mstat.textContent=e.message}
    q('#aiMin').disabled=false};
  q('#cpPrompt').onclick=async()=>{const t=minutesPrompt(st.m,false);
    try{await navigator.clipboard.writeText(t);toast('کپی شد — در Claude بچسبانید')}catch(e){toast('کپی نشد')}
    q('#pasteBox').hidden=false};
  q('#pasteNo').onclick=()=>{q('#pasteBox').hidden=true};
  q('#pasteOk').onclick=()=>{try{apply(parseMinutes(q('#pasteIn').value));q('#pasteIn').value='';q('#pasteBox').hidden=true}catch(e){mstat.className='stat err';mstat.textContent='پاسخ قابل خواندن نبود — کل پاسخ Claude را کپی کنید'}};
  q('#shareMin').onclick=async()=>{const t=q('#mMin').value.trim();if(!t){toast('هنوز صورت جلسه‌ای نوشته نشده');return}
    try{if(navigator.share){await navigator.share({title:'صورت جلسه '+(st.m.title||''),text:t});return}}catch(e){if(e.name==='AbortError')return}
    try{await navigator.clipboard.writeText(t);toast('صورت جلسه کپی شد')}catch(e){toast('کپی نشد')}};

  /* follow-up actions */
  function renderActs(){const box=q('#actList');if(!box)return;const acts=st.m.actions||[];
    box.innerHTML=acts.length?acts.map((a,i)=>`<div class="act" data-i="${i}">
      <span class="tnum">${fa(i+1)}</span>
      <input data-k="task" value="${esc(a.task)}" placeholder="اقدام">
      <input class="ow" data-k="owner" value="${esc(a.owner)}" placeholder="مسئول" list="pList">
      <input class="du" data-k="due" type="date" value="${a.due||''}">
      ${a.taskId&&S.items.get(a.taskId)?`<button class="icon" data-open="${i}">✓ در کارها</button>`:`<button class="icon primary" data-send="${i}">به کارها</button>`}
      <button class="x" data-rm="${i}" aria-label="حذف">✕</button>
      <span class="jl">${a.due?'مهلت: '+faDate(fromIso(a.due)):'مهلت تعیین نشده — اگر خالی بماند، روز بعد از جلسه ثبت می‌شود'}</span></div>`).join(''):'<div class="hint">موردی برای پیگیری ثبت نشده. پس از تهیه صورت جلسه، موارد پیگیری اینجا می‌آیند؛ یا با «+ مورد» دستی اضافه کنید.</div>';
    box.querySelectorAll('input[data-k]').forEach(inp=>{const i=+inp.closest('.act').dataset.i;
      inp.onchange=()=>{const a=st.m.actions[i];a[inp.dataset.k]=inp.value;
        if(a.taskId&&S.items.get(a.taskId)){const t=S.items.get(a.taskId);put({...t,text:actText(a),date:a.due||t.date})}
        commit();if(inp.dataset.k==='due')renderActs()}});
    box.querySelectorAll('[data-send]').forEach(b=>b.onclick=()=>{sendAct(+b.dataset.send);renderActs();toast('به کارهای '+faShort(fromIso(st.m.actions[+b.dataset.send].due||iso(fromIso(st.m.date)+1)))+' اضافه شد')});
    box.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const a=st.m.actions[+b.dataset.open];toast('در کارهای '+faShort(fromIso(S.items.get(a.taskId).date)))});
    box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{if(!b.dataset.arm){b.dataset.arm=1;b.textContent='حذف؟';b.classList.add('arm');return}
      const a=st.m.actions[+b.dataset.rm];if(a.taskId)del(a.taskId);st.m.actions.splice(+b.dataset.rm,1);commit();renderActs()});
  }
  st.renderActs=renderActs;
  const actText=(a)=>a.task+(a.owner?' — مسئول: '+a.owner:'');
  function sendAct(i){const a=st.m.actions[i];if(!a.task.trim())return;if(a.taskId&&S.items.get(a.taskId))return;
    const t={kind:'task',id:'t_'+uid(),date:a.due||iso(fromIso(st.m.date)+1),text:actText(a),done:false,at:Date.now()+i,fromMeeting:st.m.id,fromMeetingTitle:st.m.title,fromDate:st.m.date};
    put(t);a.taskId=t.id;commit()}
  q('#actAdd').onclick=()=>{(st.m.actions=st.m.actions||[]).push({id:uid(),task:'',owner:'',due:''});commit();renderActs();const ins=sh.querySelectorAll('.act input[data-k="task"]');ins[ins.length-1]?.focus()};
  q('#actAll').onclick=()=>{const acts=st.m.actions||[];let n=0;acts.forEach((a,i)=>{if(a.task.trim()&&!(a.taskId&&S.items.get(a.taskId))){sendAct(i);n++}});renderActs();toast(n?fa(n)+' مورد به کارها اضافه شد':'همه موارد قبلاً به کارها اضافه شده‌اند')};
}

$('#vM').onclick=()=>{ui.layout='month';ui.view='year';saveUI();render()};
$('#vY').onclick=()=>{ui.layout='year';ui.view='year';saveUI();render();setTimeout(()=>document.querySelector('.month.cur')?.scrollIntoView({block:'center'}),0)};
const step=(k)=>{if(ui.layout==='month'){ui.month+=k;if(ui.month<1){ui.month=12;ui.year--}if(ui.month>12){ui.month=1;ui.year++}}else ui.year+=k;if(ui.view==='search'){ui.view='year';ui.q='';$('#q').value=''}render()};

$('#goToday').onclick=()=>{ui.view='year';ui.q='';$('#q').value='';toToday();render();if(ui.layout==='year')document.querySelector('.month.cur')?.scrollIntoView({block:'center',behavior:'smooth'})};
$('#newMeet').onclick=()=>newMeeting(ui.sel!=null?iso(ui.sel):iso(TJ));
let qT;$('#q').oninput=()=>{clearTimeout(qT);qT=setTimeout(()=>{ui.q=$('#q').value;if(ui.q.trim()||ui.view==='search'){ui.view='search';render()}},200)};
$('#q').onfocus=()=>{if(ui.view!=='search'){ui.view='search';render()}};

$('#menuBtn').onclick=e=>{e.stopPropagation();$('#menu').hidden=!$('#menu').hidden};
document.addEventListener('click',e=>{if(!e.target.closest('.rel'))$('#menu').hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!ED&&ui.sel!=null)closeDay()});
$('#aiSetM').onclick=()=>{$('#menu').hidden=true;openAISettings()};
$('#exp').onclick=async()=>{$('#menu').hidden=true;
  const all=[...S.items.values()];
  for(const m of all.filter(o=>o.kind==='meeting'&&o.inkN)){const s=await loadInk(m.id);all.push({kind:'ink',id:'i_'+m.id+'_0',mid:m.id,k:0,s:JSON.stringify(s)})}
  const data=JSON.stringify({app:'salnameh',v:1,exported:new Date().toISOString(),items:all});
  const name='salnameh-backup-'+iso(TJ)+'.json';
  const blob=new Blob([data],{type:'application/json'});
  try{const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'پشتیبان سالنامه'});lsSet('salnameh.lastBackup',Date.now());setStatus('');toast('نسخه پشتیبان آماده شد');return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
  lsSet('salnameh.lastBackup',Date.now());setStatus('');toast('فایل پشتیبان دانلود شد');
};
$('#impFile').onchange=async()=>{const f=$('#impFile').files[0];$('#menu').hidden=true;if(!f)return;
  try{const d=JSON.parse(await f.text());if(!d.items)throw 0;let n=0;
    for(const o of d.items){if(o.kind==='ink'){const s=JSON.parse(o.s||'[]');const m=S.items.get(o.mid)||d.items.find(x=>x.id===o.mid);if(m)await saveInk(m,s)}else{await put(o);n++}}
    toast(fa(n)+' مورد بازگردانی شد');render()}catch(e){toast('این فایل پشتیبان سالنامه نیست')}
  $('#impFile').value=''};

initStore();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
